[project]
name = "dbt-claude-portfolio"
version = "0.1.0"
description = "Offline dbt engineering workflow with evidence-driven Claude Code hooks"
requires-python = ">=3.12,<3.13"
dependencies = ["dbt-duckdb>=1.9,<2", "sqlglot>=26,<30"]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
