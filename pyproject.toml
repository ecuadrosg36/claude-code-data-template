[project]
name = "claude-code-data-template"
version = "0.1.0"
description = "A dbt + DuckDB starter where Claude Code follows data rules and hooks block risky actions."
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "dbt-core>=1.9", "dbt-duckdb>=1.9"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/hooks"]
