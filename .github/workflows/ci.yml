name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .claude/hooks tests && uv run ruff format --check .claude/hooks tests
      - name: Hook tests
        run: uv run pytest
      - name: dbt build (models + data tests + reconciliation)
        run: uv run dbt build --profiles-dir .
